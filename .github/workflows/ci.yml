name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Shared build
        run: npm run build -w @home-music/shared

      - name: Unit tests
        run: npm run test -w @home-music/web

      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Shared build
        run: npm run build -w @home-music/shared

      - name: Unit tests (shard ${{ matrix.shard }})
        working-directory: apps/server
        run: npx tsx --test --test-shard=${{ matrix.shard }} src/*.test.ts

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Shared build
        run: npm run build -w @home-music/shared

      - name: Production verifier tests
        run: node --test scripts/verify-production.test.mjs

      - name: Backup/restore smoke (temporary SQLite)
        run: npm run smoke:backup-restore

      - name: Security regressions (server filesystem/auth)
        run: npm run test:security

      - name: Repository policies
        run: npm run test:policy

  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: critical-offline
            specs: >-
              tests/critical-smoke.spec.ts tests/browser-security-policy.spec.ts
              tests/desktop-offline-downloads.spec.ts tests/offline-account-isolation.spec.ts
              tests/offline-collections-critical.spec.ts
            projects: --project=desktop-chromium
          - name: offline-mobile
            specs: tests/offline-collections-critical.spec.ts
            projects: --project=mobile-chromium
          - name: admin 1/2
            shard: --shard=1/2
            specs: >-
              tests/admin-import-critical-pipeline.spec.ts tests/admin-operation-history.spec.ts
              tests/admin-file-move.spec.ts tests/admin-users-credential.spec.ts
              tests/admin-assistant-race.spec.ts tests/media-quarantine.spec.ts
              tests/admin-library-assistant.spec.ts tests/multi-user.spec.ts
            projects: --project=desktop-chromium
            assistant: '1'
          - name: admin 2/2
            shard: --shard=2/2
            specs: >-
              tests/admin-import-critical-pipeline.spec.ts tests/admin-operation-history.spec.ts
              tests/admin-file-move.spec.ts tests/admin-users-credential.spec.ts
              tests/admin-assistant-race.spec.ts tests/media-quarantine.spec.ts
              tests/admin-library-assistant.spec.ts tests/multi-user.spec.ts
            projects: --project=desktop-chromium
            assistant: '1'
          - name: account desktop
            specs: >-
              tests/account-security.spec.ts tests/account-navigation.spec.ts
              tests/auth-session-race.spec.ts tests/password-ux.spec.ts
            projects: --project=desktop-chromium
          - name: account mobile
            specs: >-
              tests/account-security.spec.ts tests/account-navigation.spec.ts
              tests/auth-session-race.spec.ts tests/password-ux.spec.ts
            projects: --project=mobile-chromium
          - name: account tablet
            specs: >-
              tests/account-security.spec.ts tests/account-navigation.spec.ts
              tests/auth-session-race.spec.ts tests/password-ux.spec.ts
            projects: --project=tablet-chromium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Build and browsers
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npm ci --prefix e2e --no-audit --no-fund
          if [ "$PLAYWRIGHT_CACHE_HIT" != "true" ]; then
            npm run install:browsers --prefix e2e &
            browsers=$!
          fi
          npm run build
          if [ -n "${browsers:-}" ]; then wait "$browsers"; fi

      - name: E2E
        env:
          HOME_MUSIC_E2E_LIBRARY_ASSISTANT: ${{ matrix.assistant || '' }}
        run: npm --prefix e2e test -- ${{ matrix.specs }} ${{ matrix.projects }} ${{ matrix.shard }}
