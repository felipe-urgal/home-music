name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Dependencies
        run: npm ci --no-audit --no-fund

      - name: Check (types, unit tests, build)
        run: npm run check

      - name: Repository policies
        run: npm run test:policy

      - name: Browser dependencies
        run: |
          npm ci --prefix e2e --no-audit --no-fund
          npm run install:browsers --prefix e2e

      - name: Critical and browser security E2E
        run: npm --prefix e2e test -- tests/critical-smoke.spec.ts tests/browser-security-policy.spec.ts --project=desktop-chromium

      - name: Account E2E (desktop, mobile, tablet)
        run: npm --prefix e2e test -- tests/account-security.spec.ts tests/account-navigation.spec.ts --project=desktop-chromium --project=mobile-chromium --project=tablet-chromium
