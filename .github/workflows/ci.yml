name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix e2e --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Security regressions
        run: npm run test:security

      - name: Tests
        run: npm test

      - name: Heavy work backpressure memory guard
        run: npm run benchmark:backpressure

      - name: Large library performance guard
        run: npm run benchmark:large-library

      - name: Backup/restore smoke test
        run: npm run smoke:backup-restore

      - name: Validate operational scripts
        run: |
          bash -n scripts/install-systemd.sh
          bash -n scripts/install-systemd.test.sh
          bash -n scripts/systemd-filesystem-smoke.sh
          bash -n scripts/configure-tailscale.sh
          bash -n scripts/configure-tailscale.test.sh
          bash -n scripts/configure-funnel.sh
          bash -n scripts/configure-funnel.test.sh
          bash -n scripts/run-tailscale.sh
          bash -n scripts/run-tailscale.test.sh
          bash -n scripts/check-tailscale-hardening.sh
          bash -n scripts/check-tailscale-hardening.test.sh

      - name: Test systemd startup
        run: bash scripts/install-systemd.test.sh

      - name: Smoke systemd filesystem policy
        env:
          HOME_MUSIC_REQUIRE_SYSTEMD_SMOKE: '1'
        run: bash scripts/systemd-filesystem-smoke.sh

      - name: Test Tailscale operations
        run: |
          bash scripts/configure-tailscale.test.sh
          bash scripts/configure-funnel.test.sh
          bash scripts/run-tailscale.test.sh
          bash scripts/check-tailscale-hardening.test.sh

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npm --prefix e2e run install:browsers

      - name: Browser large library performance guard
        run: npm run benchmark:large-library:browser

      - name: Critical Playwright E2E
        run: npm --prefix e2e run test:critical

      - name: Production smoke test
        run: npm run smoke:production

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect dependency graph changes
        id: dependency_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- package-lock.json e2e/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lockfiles unchanged; dependency audit is covered by main/daily runs."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Audit dependencies
        if: steps.dependency_changes.outputs.changed == 'true'
        env:
          NPM_CONFIG_FETCH_RETRIES: '1'
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '1000'
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '5000'
          NPM_CONFIG_FETCH_TIMEOUT: '15000'
        run: |
          root_status=0
          e2e_status=0
          npm audit --audit-level=high &
          root_pid=$!
          npm audit --prefix e2e --audit-level=high &
          e2e_pid=$!
          wait "$root_pid" || root_status=$?
          wait "$e2e_pid" || e2e_status=$?
          if [[ "$root_status" -ne 0 || "$e2e_status" -ne 0 ]]; then
            exit 1
          fi
