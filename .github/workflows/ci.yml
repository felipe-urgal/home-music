name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TV regression gate
        run: npm run test -w @home-music/web -- src/tv-controls.test.ts src/tv-crossfade.test.ts

      - name: Quality gate
        run: npm run check

      - name: Security regression gate
        run: npm run test:security

      - name: Backup restore smoke
        run: npm run smoke:backup-restore

      - name: Install E2E dependencies
        run: npm ci --prefix e2e --no-audit --no-fund

      - name: Install Chromium
        run: npm run install:browsers --prefix e2e

      - name: Mobile crossfade E2E
        run: npm run test --prefix e2e -- tests/crossfade-mobile.spec.ts --project=mobile-chromium

      - name: TV remote control E2E
        run: npm run test --prefix e2e -- tests/tv-remote-control.spec.ts --project=desktop-chromium

      - name: Personal data import E2E
        run: npm run test --prefix e2e -- tests/personal-data-import.spec.ts

      - name: Library Assistant E2E
        env:
          HOME_MUSIC_E2E_LIBRARY_ASSISTANT: '1'
        run: npm run test --prefix e2e -- tests/admin-library-assistant.spec.ts --project=desktop-chromium
