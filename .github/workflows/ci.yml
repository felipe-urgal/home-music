name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Validate operational scripts
        run: |
          bash -n scripts/install-systemd.sh
          bash -n scripts/configure-tailscale.sh
          bash -n scripts/configure-tailscale.test.sh

      - name: Test Tailscale operations
        run: bash scripts/configure-tailscale.test.sh

      - name: Build
        run: npm run build

      - name: Production smoke test
        run: npm run smoke:production
