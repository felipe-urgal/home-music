name: Android TV

on:
  pull_request:
    paths:
      - 'android-tv/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-tv.yml'
  push:
    branches:
      - main
    paths:
      - 'android-tv/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Build offline TV receiver
        run: |
          npm run build -w @home-music/shared
          npm run build:tv-receiver -w @home-music/web

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.10.2'

      - name: Test, build and lint Home Music TV
        run: gradle -p android-tv :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace

      - name: Verify embedded receiver and bridge
        run: |
          unzip -l android-tv/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/(tv-offline-receiver\.html|assets/.+\.(js|css))'
          unzip -l android-tv/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/bridge.html'
          unzip -l android-tv/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/bridge.js'

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: home-music-tv-debug-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
