name: Account 658 verification

on:
  push:
    branches:
      - refactor/658-account-sessions-dialogs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:security
      - run: npm ci --prefix e2e --no-audit --no-fund
      - run: npm run install:browsers --prefix e2e
      - run: npm --prefix e2e test -- tests/account-security.spec.ts tests/account-navigation.spec.ts --project=desktop-chromium --project=mobile-chromium
