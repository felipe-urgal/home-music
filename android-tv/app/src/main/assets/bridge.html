<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home Music LAN bridge</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111;
    }

    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #333;
      border-radius: 18px;
      background: #1b1b1b;
      box-shadow: 0 16px 40px rgb(0 0 0 / 30%);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #aaa;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: #d7d7d7;
      font-size: 0.9rem;
    }

    .state::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #888;
    }

    body[data-state="pairing"] .state::before {
      background: #f3c969;
    }

    body[data-state="ready"] .state::before {
      background: #67d391;
    }

    body[data-state="error"] .state::before,
    body[data-state="expired"] .state::before {
      background: #ef7b7b;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 6vw, 2rem);
      line-height: 1.15;
    }

    #bridge-status {
      margin: 14px 0 0;
      color: #c8c8c8;
      line-height: 1.55;
    }

    #bridge-return {
      width: 100%;
      margin-top: 22px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: #f5f5f5;
      color: #111;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #bridge-return[hidden] {
      display: none;
    }

    .hint {
      margin: 18px 0 0;
      color: #8f8f8f;
      font-size: 0.84rem;
      line-height: 1.45;
    }
  </style>
</head>
<body data-state="initializing">
  <main aria-live="polite" aria-atomic="true">
    <p class="eyebrow">Home Music · conexão local</p>
    <div class="state" id="bridge-state-label">Inicializando</div>
    <h1 id="bridge-title">Preparando conexão</h1>
    <p id="bridge-status">Inicializando bridge…</p>
    <button id="bridge-return" type="button" hidden>Voltar ao Home Music</button>
    <p class="hint">Esta página apenas intermedia o pareamento local. O áudio e os controles seguem pela conexão P2P.</p>
  </main>
  <script src="/bridge.js"></script>
</body>
</html>
