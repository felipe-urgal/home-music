plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('ANDROID_TV_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_TV_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_TV_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_TV_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.homemusic.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homemusic.tv'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = false
            enableV4Signing = false
        }

        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = false
                enableV4Signing = false
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    // Bundle a modern browser engine so old/custom BTV WebView builds do not
    // determine whether the Home Music frontend can render.
    implementation 'org.mozilla.geckoview:geckoview:126.0.20240526221752'
}
