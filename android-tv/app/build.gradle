plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('ANDROID_TV_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_TV_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_TV_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_TV_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.homemusic.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homemusic.tv'
        // Keep the launcher compatible with older/custom Android TV firmware.
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '0.1.1'
    }

    signingConfigs {
        debug {
            // Some Android TV boxes use an older/custom package installer that
            // still expects a JAR (v1) signature even when Android itself can
            // validate APK Signature Scheme v2.
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = false
            enableV4Signing = false
        }

        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = false
                enableV4Signing = false
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
