plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('ANDROID_TV_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_TV_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_TV_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_TV_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def receiverDistDir = file("${rootProject.projectDir}/../apps/web/dist-tv-receiver")

android {
    namespace 'com.homemusic.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homemusic.tv'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = false
            enableV4Signing = false
        }

        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = false
                enableV4Signing = false
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDir receiverDistDir
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

tasks.register('verifyTvOfflineReceiverAssets') {
    inputs.dir(receiverDistDir)
    doLast {
        def entry = new File(receiverDistDir, 'tv-offline-receiver.html')
        if (!entry.isFile()) {
            throw new GradleException("Receiver offline ausente: execute npm run build:tv-receiver -w @home-music/web antes do build Android.")
        }
        def assetDir = new File(receiverDistDir, 'assets')
        if (!assetDir.isDirectory() || assetDir.listFiles() == null || assetDir.listFiles().length == 0) {
            throw new GradleException('Receiver offline inválido: bundle assets/ não foi gerado.')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyTvOfflineReceiverAssets')
}

dependencies {
    // Bundle a modern browser engine so old/custom BTV WebView builds do not
    // determine whether the Home Music frontend can render.
    implementation 'org.mozilla.geckoview:geckoview:126.0.20240526221752'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
