<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home Music — iOS LAN bridge probe</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; line-height: 1.45; background: #07101a; color: #eef4f9; }
    input, button { box-sizing: border-box; width: 100%; font: inherit; padding: 12px; margin-top: 10px; border-radius: 10px; }
    button { font-weight: 700; cursor: pointer; }
    #status { margin-top: 18px; padding: 14px; border: 1px solid #52606d; border-radius: 10px; min-height: 24px; white-space: pre-wrap; }
    small { color: #aebdca; }
  </style>
</head>
<body>
  <h1>Teste bridge LAN no iPhone</h1>
  <p>Informe apenas o endereço local exibido pela BTV. Este teste não usa nem envia o segredo do QR.</p>
  <label for="bridgeUrl">URL do bridge</label>
  <input id="bridgeUrl" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="http://192.168.0.74:37085/bridge" />
  <button id="test" type="button">Abrir bridge e testar PING/PONG</button>
  <div id="status" role="status">Aguardando teste.</div>
  <p><small>Resultado esperado: a página local da BTV abre e esta página recebe um PONG via window.opener/postMessage.</small></p>
  <script>
    (() => {
      const input = document.getElementById('bridgeUrl');
      const button = document.getElementById('test');
      const status = document.getElementById('status');
      let bridgeWindow = null;
      let timer = null;
      let nonce = null;
      let expectedOrigin = null;

      const setStatus = value => { status.textContent = value; };
      const cleanup = () => {
        if (timer !== null) clearTimeout(timer);
        timer = null;
      };

      window.addEventListener('message', event => {
        if (!bridgeWindow || event.source !== bridgeWindow || event.origin !== expectedOrigin) return;
        const data = event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'home-music-lan-bridge-ready') {
          setStatus('Bridge abriu e preservou window.opener. Enviando PING…');
          bridgeWindow.postMessage({ type: 'home-music-lan-bridge-ping', nonce }, expectedOrigin);
          return;
        }
        if (data.type === 'home-music-lan-bridge-pong' && data.nonce === nonce) {
          cleanup();
          setStatus('SUCESSO: PONG recebido. HTTPS → HTTP top-level + window.opener/postMessage funciona neste iPhone.');
        }
      });

      button.addEventListener('click', () => {
        cleanup();
        let url;
        try { url = new URL(input.value.trim()); } catch { setStatus('URL inválida. Use http://IP:PORTA/bridge'); return; }
        if (url.protocol !== 'http:' || url.pathname !== '/bridge') { setStatus('Use exatamente http://IP:PORTA/bridge'); return; }
        expectedOrigin = url.origin;
        nonce = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
        bridgeWindow = window.open(url.href, 'home-music-ios-lan-bridge');
        if (!bridgeWindow) { setStatus('FALHA: o iOS bloqueou a abertura da página bridge.'); return; }
        setStatus('Página bridge aberta. Aguardando READY/PONG…');
        timer = setTimeout(() => setStatus('FALHA: sem PONG em 12 s. Veja a página bridge e me envie o texto exibido nela.'), 12000);
      });
    })();
  </script>
</body>
</html>
